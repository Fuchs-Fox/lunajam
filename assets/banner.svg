<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-label="LunaJam native TIDAL Jam rooms and Discord Listen Together banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090a0e" />
      <stop offset="55%" stop-color="#0e1017" />
      <stop offset="100%" stop-color="#131620" />
    </linearGradient>
    <radialGradient id="glow" cx="930" cy="230" r="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2ee6d6" stop-opacity="0.16" />
      <stop offset="55%" stop-color="#2ee6d6" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#2ee6d6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="art1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0d9488" />
