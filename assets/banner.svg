      <rect x="640" y="248" width="36" height="36" rx="6" fill="url(#art1)" />
      <text x="688" y="263" fill="#2ee6d6" font-size="13" font-weight="600">Midnight City</text>
      <text x="688" y="279" fill="rgba(255,255,255,0.58)" font-size="11.5">M83</text>
      <circle cx="960" cy="266" r="11.5" fill="#3b82f6" />
