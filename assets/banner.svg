      <path d="M10.5 29c0-3.2 2.8-5.4 6.5-5.4s6.5 2.2 6.5 5.4" fill="none" stroke="#2ee6d6" stroke-width="1.8" stroke-linecap="round" />
      <path d="M26.5 14.8a5.8 5.8 0 0 1 0 9.4" fill="none" stroke="#2ee6d6" stroke-width="1.8" stroke-linecap="round" />
